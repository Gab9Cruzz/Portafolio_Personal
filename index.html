<html lang="es" data-theme="dark">

      content="Portafolio de Gabriel Cruz: estudiante de Ingeniería en Sistemas Inteligentes en Guayaquil, con experiencia en ciberseguridad, redes, gestión de identidades y automatización."

    <meta name="theme-color" content="#0B0F17" />
    <link rel="canonical" href="https://gab9cruzz.github.io/Portafolio_Personal/" />

    <script>
      // Aplica idioma y tema guardados antes del primer pintado (evita parpadeos).
      try {
        var t = localStorage.getItem('gc-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var l = localStorage.getItem('gc-lang')
        if (l === 'es' || l === 'en') document.documentElement.lang = l
      } catch (e) {}
    </script>
  </head>
  <body>

    <noscript
      >Gabriel Cruz — Ciberseguridad y Redes. Activa JavaScript para ver el portafolio.</noscript
    >

  </body>
